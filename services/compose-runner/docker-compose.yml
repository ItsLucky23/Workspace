services:
  runner:
    build:
      context: ../..
      dockerfile: services/compose-runner/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    expose:
      - "8787"
    volumes:
      - runner-state:/var/lib/workspaces-compose-runner
      - ${PVE_SSH_PRIVATE_KEY_HOST_FILE:?set PVE_SSH_PRIVATE_KEY_HOST_FILE}:/run/secrets/proxmox-ssh-key:ro
      - ${PVE_CA_HOST_FILE:-./certs/proxmox-ca.crt}:/run/secrets/proxmox-ca.crt:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    networks:
      - runner-control

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - runner-control

networks:
  runner-control:
    driver: bridge

volumes:
  runner-state:
  caddy-data:
  caddy-config:
