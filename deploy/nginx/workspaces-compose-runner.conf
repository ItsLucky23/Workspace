server {
    listen 80;
    listen [::]:80;
    server_name runner.workspace.keetlerop.nl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name runner.workspace.keetlerop.nl;

    ssl_certificate /etc/letsencrypt/live/keetlerop.nl-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keetlerop.nl-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1100k;
    proxy_connect_timeout 10s;
    # Must exceed WS_COMPOSE_RUNNER_TIMEOUT_MS: cold full-VM clones are one long request.
    proxy_send_timeout 1900s;
    proxy_read_timeout 1900s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
