server {
    listen 80;
    server_name app.workspace.keetlerop.nl;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.workspace.keetlerop.nl;

    ssl_certificate /etc/letsencrypt/live/keetlerop.nl-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keetlerop.nl-0001/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 50m;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Atomic dynamic preview/editor routes written by server/proxy/nginxProvider.ts.
include /var/lib/workspaces/nginx-routes.conf;
