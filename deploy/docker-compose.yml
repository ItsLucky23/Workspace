# Workspaces — self-host stack (#7). One compose brings up the whole product: the app, its data
# stores (MongoDB as a single-node replica set — Prisma requires a replica set for transactions —
# and Redis), and the Caddy reverse proxy that fronts the app + every per-ticket preview subdomain.
#
# The app launches per-ticket Docker containers, so it needs the host Docker socket + a shared
# `workspaces-net` network the ticket containers also join. Bring it up with deploy/bootstrap.sh
# (which generates the secrets in .env first). See docs/DR_RUNBOOK.md for backup/restore.

name: workspaces

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initialize the single-node replica set once, then report healthy when it responds.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks: [internal]

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [internal]

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: [.env]
    environment:
      # The stores live on the internal network under their service names.
      DATABASE_URL: "mongodb://mongo:27017/workspaces?replicaSet=rs0"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SERVER_PORT: "80"
      # The app shells out to Docker to launch ticket containers (socket mounted below).
      WS_DOCKER_BIN: /usr/bin/docker
      WS_NET: workspaces-net
      WS_AUTH_DIR: /app/data/_auth
      # Caddy's Admin API is reachable only on the private management network.
      WS_CADDY_ADMIN: http://caddy-admin:2019
      # Edge-auth is mandatory in the self-host stack; subrequests stay on management.
      WS_EDITOR_EDGE_AUTH: "1"
      WS_EDITOR_AUTH_BACKEND: app-upstream:80
    volumes:
      # Persistent app data (repos, editor profiles, encrypted secrets, auth) + the Docker socket
      # so the app can launch/stop per-ticket containers on the host engine.
      - app-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:80/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      internal: {}
      management:
        aliases: [app-upstream]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    environment:
      # Must be inside WS_CADDY_MANAGEMENT_SUBNET; Caddyfile binds Admin to this IP only.
      WS_CADDY_ADMIN_IP: "${WS_CADDY_ADMIN_IP:-172.30.0.2}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      management:
        ipv4_address: "${WS_CADDY_ADMIN_IP:-172.30.0.2}"
        aliases: [caddy-admin]
      workspaces-net: {}

volumes:
  mongo-data:
  redis-data:
  app-data:
  caddy-data:
  caddy-config:

networks:
  internal:
  # App↔Caddy control traffic only. No explicit `name`: Compose project-scopes this network,
  # so separate Workspaces projects never share an Admin plane.
  management:
    internal: true
    ipam:
      config:
        - subnet: "${WS_CADDY_MANAGEMENT_SUBNET:-172.30.0.0/24}"
  # Shared with the per-ticket containers Caddy proxies to (WS_NET). `external: true` because the
  # app creates/owns this network at runtime — compose must attach to the EXISTING one, not try to
  # manage a duplicate. Create it once with:
  #   docker network create workspaces-net
  workspaces-net:
    external: true
    name: workspaces-net
